name: Build Go Binaries

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin] 
        goarch: [amd64, arm64] 
        include:
          # Target Apple Silicon specifically
          - goos: darwin
            goarch: arm64
            output: build/ktd-plugin-tools-darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: '^1.22'
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }} 
          CGO_ENABLED: 0 
        run:  go build -o ${{ matrix.output || 'build/ktd-plugin-tools-$GOOS-$GOARCH' }} ./main.go 
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }} 
          path: build/

